<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>review - book aesthetic</title>
  <link rel="stylesheet" href="./style_reviewpage.css">
</head>
<body class="has-bg">

  <div class="review-page">

    <!-- TITLE + CATEGORY -->
    <header class="review-header-box">
    <h1 id="book-title">Book Title — Author Name</h1>
    <p id="book-category" class="book-category">(Category)</p>
    </header>


    <!-- PHOTO + REVIEW BOX -->
    <main class="review-content">
      <div class="photo-box">
        <img id="book-cover" src="" alt="book cover">
      </div>

      <div class="text-box">
        <p id="book-review"></p>
      </div>
    </main>

    <!-- PERSONAL NOTE -->
    <p id="book-personal" class="personal-note"></p>

    <!-- BACK LINK -->
    <footer class="review-footer">
      <a href="reviews.html">← назад до освртите</a>
    </footer>

  </div>

  <script src="./review.js"></script>
</body>
</html>
