<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>book aesthetic</title>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
</head>

<body class="has-bg">

  <div class="page">

    <!-- HEADER BOX -->
    <header class="header-box">
      <h1 id="logo">book aesthetic</h1>
      <span id="visitor-count">souls who passed through: 000123</span>
    </header>

    <!-- MAIN CONTENT -->
    <main class="content-wrapper">
      <div class="content">
        <!-- PHOTO BOX -->
        <div class="photo-box">
          <img id="profile-photo" alt="me" />
        </div>

        <!-- TEXT BOX -->
        <div class="text-box">
          <div class="divider" data-char="-"></div>
          <p id="intro-note"></p>
          <div class="divider" data-char="-"></div>
        </div>
      </div>
    </main>


    <!-- NAV BUTTONS -->
    <nav class="nav-footer">
      <div id="nav-buttons"></div>
    </nav>


    <!-- EMAIL -->
    <div class="mail-box" style="text-align: center;">
      <a href="mailto:bookaesthetic1@gmail.com" class="btn">send me a sentence that got stuck with you ^_^</a>
    </div>


    <!-- LAST UPDATED -->
    <footer class="last-updated">
     <span id="last-updated"></span>
    </footer>

  </div>

  <script src="./main.js"></script>
</body>
</html>
